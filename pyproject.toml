[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-oncology-benchmark"
version = "0.1.0"
description = "Reproducible classical, quantum, and evolutionary computational oncology research benchmarks."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
  {name = "Ray Beecham"}
]
keywords = [
  "quantum-computing",
  "quantum-machine-learning",
  "oncology",
  "cancer-research",
  "tumor-evolution",
  "adaptive-therapy",
  "benchmarking",
  "reproducibility"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
quantum = [
  "qiskit>=2.0,<3",
  "qiskit-machine-learning>=0.9,<0.10"
]
dashboard = [
  "streamlit>=1.40,<2"
]
dev = [
  "mypy>=1.13,<3",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0"
]
all = [
  "qiskit>=2.0,<3",
  "qiskit-machine-learning>=0.9,<0.10",
  "streamlit>=1.40,<2"
]

[project.scripts]
qob = "quantum_oncology_benchmark.cli:main"

[project.urls]
Repository = "https://github.com/raybeecham/quantum-oncology-benchmark"
Issues = "https://github.com/raybeecham/quantum-oncology-benchmark/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "quantum: tests requiring the optional quantum dependencies"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
packages = ["quantum_oncology_benchmark"]

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "scipy.*",
  "qiskit.*",
  "qiskit_machine_learning.*",
  "streamlit.*"
]
ignore_missing_imports = true
